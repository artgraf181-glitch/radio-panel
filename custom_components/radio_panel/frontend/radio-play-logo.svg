<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Radio Play</title>
  <desc id="desc">Niebieska ikona radia z przyciskiem odtwarzania i falami radiowymi.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="44" x2="438" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58C8FF"/>
      <stop offset="0.48" stop-color="#167AF4"/>
      <stop offset="1" stop-color="#1236A7"/>
    </linearGradient>
    <linearGradient id="play" x1="152" y1="141" x2="330" y2="371" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE978"/>
      <stop offset="0.45" stop-color="#FF982F"/>
      <stop offset="1" stop-color="#FF315A"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(137 91) rotate(45) scale(341)">
      <stop stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#051B5B" flood-opacity=".42"/>
    </filter>
    <filter id="playShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#8A1746" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect x="30" y="30" width="452" height="452" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="42" y="42" width="428" height="428" rx="101" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="4"/>
  <rect x="30" y="30" width="452" height="452" rx="112" fill="url(#shine)"/>
  <path d="M178 151c0-19 21-30 37-20l151 96c15 10 15 32 0 42l-151 96c-16 10-37-1-37-20V151Z" fill="url(#play)" filter="url(#playShadow)"/>
  <path d="M183 153c0-14 16-22 28-15l145 93c11 7 11 25 0 32l-145 93c-12 7-28-1-28-15V153Z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M310 121c38 9 69 39 79 77" stroke-width="19" stroke-opacity=".96"/>
    <path d="M317 168c19 6 35 21 41 41" stroke-width="18" stroke-opacity=".9"/>
  </g>
  <circle cx="383" cy="115" r="8" fill="#fff" fill-opacity=".95"/>
</svg>
